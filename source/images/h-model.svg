<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Humans API data model</title>
  <desc id="desc">A human is the central record. Users, cards, certificates, facial recognition records, space-time records and body measurements each belong to one human. Humans and skills are linked many-to-many through human_skill, and skills and specialities through skill_speciality.</desc>
  <style>
    .box { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.5; }
    .hub { fill: #EEF2FF; stroke: #4F46E5; stroke-width: 2; }
    .name { font-size: 15px; font-weight: bold; fill: #0F172A; }
    .field { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #475569; }
    .one { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
    .many { stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .label { font-size: 11px; fill: #64748B; }
  </style>
  <rect width="840" height="540" fill="#FFFFFF"/>

  <!-- one-to-many connectors from human -->
  <path class="one" d="M305 170 L250 62"/>
  <path class="one" d="M305 202 L250 192"/>
  <path class="one" d="M305 234 L250 322"/>
  <path class="one" d="M535 170 L590 62"/>
  <path class="one" d="M535 202 L590 192"/>
  <path class="one" d="M420 264 L420 330"/>

  <!-- many-to-many connectors -->
  <path class="many" d="M535 234 L590 322"/>
  <text class="label" x="560" y="300" text-anchor="end">human_skill</text>
  <path class="many" d="M705 364 L705 410"/>
  <text class="label" x="697" y="391" text-anchor="end">skill_speciality</text>

  <!-- left column -->
  <rect class="box" x="20" y="20" width="230" height="84" rx="6"/>
  <text class="name" x="36" y="46">user</text>
  <text class="field" x="36" y="68">email · platform</text>
  <text class="field" x="36" y="86">role · status</text>

  <rect class="box" x="20" y="150" width="230" height="84" rx="6"/>
  <text class="name" x="36" y="176">card</text>
  <text class="field" x="36" y="198">bank · account_type</text>
  <text class="field" x="36" y="216">account_number · expiration_date</text>

  <rect class="box" x="20" y="280" width="230" height="84" rx="6"/>
  <text class="name" x="36" y="306">certificate</text>
  <text class="field" x="36" y="328">description · issued_at</text>
  <text class="field" x="36" y="346">file_path</text>

  <!-- hub -->
  <rect class="hub" x="305" y="140" width="230" height="124" rx="6"/>
  <text class="name" x="321" y="168">human</text>
  <text class="field" x="321" y="192">unique_id · legal_id</text>
  <text class="field" x="321" y="212">name · lastname</text>
  <text class="field" x="321" y="232">birthdate · gender</text>

  <!-- below hub -->
  <rect class="box" x="305" y="330" width="230" height="84" rx="6"/>
  <text class="name" x="321" y="356">body_measurement</text>
  <text class="field" x="321" y="378">height_cm · weight_kg</text>
  <text class="field" x="321" y="396">measured_at</text>

  <!-- right column -->
  <rect class="box" x="590" y="20" width="230" height="84" rx="6"/>
  <text class="name" x="606" y="46">facial_recognition</text>
  <text class="field" x="606" y="68">facial_data_hash</text>
  <text class="field" x="606" y="86">facial_validation</text>

  <rect class="box" x="590" y="150" width="230" height="84" rx="6"/>
  <text class="name" x="606" y="176">space_time</text>
  <text class="field" x="606" y="198">longitude · latitude</text>
  <text class="field" x="606" y="216">timestamp</text>

  <rect class="box" x="590" y="280" width="230" height="84" rx="6"/>
  <text class="name" x="606" y="306">skill</text>
  <text class="field" x="606" y="328">name · description</text>

  <rect class="box" x="590" y="410" width="230" height="84" rx="6"/>
  <text class="name" x="606" y="436">speciality</text>
  <text class="field" x="606" y="458">description</text>

  <!-- legend -->
  <path class="one" d="M24 452 L74 452"/>
  <text class="label" x="84" y="456">one human, many records</text>
  <path class="many" d="M24 482 L74 482"/>
  <text class="label" x="84" y="486">many-to-many, through a link table</text>
</svg>
